apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

// A standalone APK that boots the rish Linux guest and reports what happened
// on screen. It exists because the only existing proof -- LocalGuestBootTest --
// runs through `am instrument`, and the HarmonyOS phones we care about reach
// Android through the 卓易通 compatibility layer, where adb is not available:
// nothing on the host can drive an instrumentation run. This app needs a
// finger and a screen, nothing else.
//
// It shares the guest sources with :app rather than copying them, so the code
// under test is the code that ships. It uses native Android views and the shared guest runtime.
def rishFfiDirProperty = providers.gradleProperty("rishFfiDir").orNull
def rishFfiDir = rishFfiDirProperty == null ? file("../rish-ffi") : file(rishFfiDirProperty)
if (!new File(rishFfiDir, "rish_ffi.version").isFile()) {
    throw new GradleException("the guest probe needs a staged runtime: ${rishFfiDir} has no rish_ffi.version; run scripts/prepare-rish-android.sh")
}
def rishStagedAbis = (new File(rishFfiDir, "jniLibs").listFiles() ?: new File[0])
    .findAll { it.isDirectory() && new File(it, "librish_ffi.so").isFile() }.collect { it.name }.sort()
def guestAssetsDir = file("../../shared/GuestAssets")
if (!new File(guestAssetsDir, "SHA256SUMS").isFile()) {
    throw new GradleException("guest boot assets are missing: ${guestAssetsDir}")
}

android {
    namespace "tech.zseven.rish.guestprobe"
    ndkVersion "27.1.12297006"
    compileSdk 36

    defaultConfig {
        applicationId "tech.zseven.rish.guestprobe"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        // Only the ABIs the runtime was staged for; an unstaged ABI would
        // install and then fail to load, which is the one outcome that would
        // make this probe lie.
        ndk { abiFilters.addAll(rishStagedAbis) }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                          "-DRISH_FFI_DIR=${rishFfiDir.absolutePath}".toString()
                targets "rish_guest_jni", "guestprobe_jni"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            // The shipping guest code, not a copy of it.
            java.srcDirs += ["../src/main/java/tech/zseven/rish/guest"]
            jniLibs.srcDirs += [new File(rishFfiDir, "jniLibs")]
            assets.srcDirs += [guestAssetsDir]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key on purpose: this is a diagnostic tool
            // that is never distributed, and requiring the release key would
            // put it behind the same secret the app needs.
            signingConfig signingConfigs.debug
        }
    }
    kotlinOptions { jvmTarget = "17" }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
}
