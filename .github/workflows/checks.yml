name: Source and security checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    name: Portable GPUI source and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify secret scanner self-test
        run: ruby scripts/tests/verify-no-bundled-secret_selftest.rb
      - name: Scan tracked files for bundled secrets
        run: ruby scripts/verify-no-bundled-secret.rb --tracked
      - name: Scan repository history for bundled secrets
        run: ruby scripts/verify-no-bundled-secret.rb --history HEAD
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
      - name: Install shell used by native preparation preflight
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - name: Verify portable GPUI source checkout
        run: |
          node --test scripts/tests/source-preflight.test.mjs scripts/tests/ios-preparation.test.mjs scripts/tests/release-identifiers.test.mjs scripts/tests/guest-assets.test.mjs
          node scripts/verify-source-checkout.mjs
          ruby scripts/tests/ios-plist_test.rb
